<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Universe Map</title>
    
    <link rel="icon" href="data:,">
    
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #mynetwork {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #38bdf8;
            font-size: 20px;
            z-index: 50;
            pointer-events: none;
            text-align: center;
        }

        /* Mobile-friendly Sidebar */
        .sidebar {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 200px;
            background: rgba(15, 23, 42, 0.90);
            color: white;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 10;
            font-size: 12px;
        }

        h2 { margin: 0 0 5px 0; font-size: 1rem; color: #38bdf8; }
        p { margin: 0 0 10px 0; color: #94a3b8; line-height: 1.3; }

        .legend-row { display: flex; align-items: center; margin-top: 5px; }
        .l-box { width: 10px; height: 10px; margin-right: 8px; border-radius: 2px; }
        .l-circle { width: 10px; height: 10px; margin-right: 8px; border-radius: 50%; border: 1px solid white; }

        /* Recenter Button */
        .recenter-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 10;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="loading">Loading Map...<br><span style="font-size:12px; opacity:0.7">Please wait...</span></div>

    <div class="sidebar">
        <h2>🇮🇳 Media Universe</h2>
        <p>Tap nodes to see connections.</p>
        <div style="border-top: 1px solid #475569; padding-top: 5px;">
            <div class="legend-row"><div class="l-circle" style="background:#3b82f6"></div>Owners (Big Dots)</div>
            <div class="legend-row"><div class="l-box" style="background:#334155"></div>Companies (Squares)</div>
            <div class="legend-row"><div class="l-box" style="background:#ef4444"></div>News</div>
            <div class="legend-row"><div class="l-box" style="background:#10b981"></div>Print</div>
            <div class="legend-row"><div class="l-box" style="background:#eab308"></div>Movies/Music</div>
            <div class="legend-row"><div class="l-box" style="background:#8b5cf6"></div>OTT</div>
        </div>
    </div>

    <button class="recenter-btn" onclick="fitMap()">🎯 Recenter</button>

    <div id="mynetwork"></div>

    <script type="text/javascript">
        // Wait for window load
        window.onload = function() {
            
            // --- DATASET ---
            const nodes = [
                // JIOSTAR
                { id: 'ambani', label: 'Mukesh Ambani', group: 'owner', color: '#2563EB', size: 50 },
                { id: 'disney_hq', label: 'Disney', group: 'owner', color: '#2563EB', size: 40 },
                { id: 'jiostar', label: 'JioStar', group: 'house', size: 35 },
                { id: 'nw18', label: 'Network18', group: 'house', size: 30 },
                { id: 'starplus', label: 'Star Plus', group: 'movie' },
                { id: 'hotstar', label: 'Hotstar', group: 'ott' },
                { id: 'starsports', label: 'Star Sports', group: 'sports', color: '#f97316' },
                { id: 'cnn18', label: 'CNN-News18', group: 'news' },

                // ADANI
                { id: 'adani', label: 'Gautam Adani', group: 'owner', color: '#059669', size: 50 },
                { id: 'ndtv_group', label: 'NDTV', group: 'house' },
                { id: 'ndtv247', label: 'NDTV 24x7', group: 'news' },
                
                // TIMES
                { id: 'jain', label: 'Jain Family', group: 'owner', color: '#DC2626', size: 50 },
                { id: 'bccl', label: 'Times Group', group: 'house' },
                { id: 'toi', label: 'Times of India', group: 'print' },
                { id: 'timesnow', label: 'Times Now', group: 'news' },

                // ZEE
                { id: 'chandra', label: 'Subhash Chandra', group: 'owner', color: '#d97706', size: 45 },
                { id: 'zeel', label: 'ZEE Ent.', group: 'house' },
                { id: 'zeetv', label: 'Zee TV', group: 'movie' },

                // SONY
                { id: 'sony_in', label: 'Sony India', group: 'house' },
                { id: 'set', label: 'Sony TV', group: 'movie' },

                // SUN
                { id: 'maran', label: 'Kalanithi Maran', group: 'owner', color: '#7C3AED', size: 45 },
                { id: 'sun_grp', label: 'Sun Group', group: 'house' },
                { id: 'suntv', label: 'Sun TV', group: 'movie' },

                // TV9
                { id: 'tv9_net', label: 'TV9 Network', group: 'house' },
                { id: 'tv9b', label: 'TV9 Bharat', group: 'news' },

                // PRINT GIANTS
                { id: 'bhaskar', label: 'Dainik Bhaskar', group: 'print' },
                { id: 'jagran', label: 'Dainik Jagran', group: 'print' },
                { id: 'manorama', label: 'Manorama', group: 'print' }
            ];

            const edges = [
                { from: 'ambani', to: 'jiostar' }, { from: 'ambani', to: 'nw18' },
                { from: 'disney_hq', to: 'jiostar' },
                { from: 'jiostar', to: 'starplus' }, { from: 'jiostar', to: 'hotstar' }, { from: 'jiostar', to: 'starsports' },
                { from: 'nw18', to: 'cnn18' },
                { from: 'adani', to: 'ndtv_group' }, { from: 'ndtv_group', to: 'ndtv247' },
                { from: 'jain', to: 'bccl' }, { from: 'bccl', to: 'toi' }, { from: 'bccl', to: 'timesnow' },
                { from: 'chandra', to: 'zeel' }, { from: 'zeel', to: 'zeetv' },
                { from: 'sony_in', to: 'set' },
                { from: 'maran', to: 'sun_grp' }, { from: 'sun_grp', to: 'suntv' },
                { from: 'tv9_net', to: 'tv9b' }
            ];

            // --- CONFIGURATION ---
            const container = document.getElementById('mynetwork');
            const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
            
            const options = {
                nodes: { 
                    shape: 'dot', 
                    font: { face: 'sans-serif', color: 'white', size: 14, strokeWidth: 2, strokeColor: '#000' },
                    borderWidth: 2, 
                    shadow: true
                },
                groups: {
                    // ERROR FIXED HERE: Changed from 'circularImage' to 'dot'
                    owner: { shape: 'dot', font: {size: 16} }, 
                    house: { shape: 'box', color: '#334155', font: {color: 'white'} },
                    news: { color: '#ef4444', shape: 'dot', size: 15 },
                    print: { color: '#10b981', shape: 'dot', size: 15 },
                    movie: { color: '#eab308', shape: 'dot', size: 15 },
                    ott: { color: '#8b5cf6', shape: 'dot', size: 15 },
                    sports: { color: '#f97316', shape: 'dot', size: 15 }
                },
                edges: { width: 1, color: { color: '#64748b', opacity: 0.5 } },
                physics: {
                    // Optimized for Mobile: Prevents explosion
                    forceAtlas2Based: {
                        gravitationalConstant: -80,
                        centralGravity: 0.01,
                        springConstant: 0.08,
                        springLength: 100,
                        damping: 0.4,
                        avoidOverlap: 0.5
                    },
                    solver: 'forceAtlas2Based',
                    stabilization: {
                        enabled: true,
                        iterations: 200, 
                        updateInterval: 25
                    }
                },
                interaction: { 
                    hover: true, 
                    zoomView: true, 
                    dragView: true 
                }
            };

            // Initialize Network
            window.network = new vis.Network(container, data, options);

            // Force fit to screen when stabilization finishes
            network.once("stabilizationIterationsDone", function() {
                document.getElementById('loading').style.display = 'none';
                network.fit(); 
            });
            
            // Interaction: Click to highlight
            network.on("click", function (params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const connectedNodes = network.getConnectedNodes(nodeId);
                    const allNodes = data.nodes.getIds();
                    
                    const updateArray = allNodes.map(id => {
                        return { id: id, opacity: 0.1, font: { color: 'rgba(255,255,255,0.1)' } };
                    });
                    
                    connectedNodes.push(nodeId);
                    connectedNodes.forEach(id => {
                        const index = updateArray.findIndex(n => n.id === id);
                        if(index !== -1) {
                            updateArray[index].opacity = 1;
                            updateArray[index].font = { color: 'white' };
                        }
                    });
                    data.nodes.update(updateArray);
                } else {
                    const allNodes = data.nodes.getIds();
                    const resetArray = allNodes.map(id => {
                        return { id: id, opacity: 1, font: { color: 'white' } };
                    });
                    data.nodes.update(resetArray);
                }
            });

            // Handle Resize
            window.addEventListener('resize', function() {
                network.fit();
            });
        };

        function fitMap() {
            if(window.network) {
                window.network.fit({ 
                    animation: { duration: 1000, easingFunction: 'easeInOutQuad' } 
                });
            }
        }
    </script>
</body>
</html>
