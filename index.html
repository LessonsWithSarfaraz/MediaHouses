<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indian Media Hierarchy</title>
    <link rel="icon" href="data:,">
    
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"></script>
    
    <style>
        /* --- CSS STYLING --- */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #1e293b; /* Slate-800 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #mynetwork {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0; z-index: 1;
        }

        /* Control Panel */
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 260px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #475569;
            padding: 15px;
            border-radius: 8px;
            color: #e2e8f0;
            z-index: 100;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            max-height: 80vh;
            overflow-y: auto;
        }

        h2 { font-size: 1.1rem; margin-top: 0; margin-bottom: 10px; color: #38bdf8; border-bottom: 1px solid #475569; padding-bottom: 5px; }
        
        /* Form Elements */
        label { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.9rem; cursor: pointer; }
        select { width: 100%; padding: 8px; background: #334155; color: white; border: 1px solid #475569; border-radius: 4px; margin-bottom: 15px; }
        
        input[type="checkbox"] { margin-right: 10px; accent-color: #38bdf8; width: 16px; height: 16px; }

        .tag { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }

        /* Mobile Responsive Adjustments */
        @media (max-width: 600px) {
            .controls {
                width: calc(100% - 40px);
                top: auto; bottom: 20px;
                max-height: 40vh;
            }
        }
    </style>
</head>
<body>

    <div class="controls">
        <h2>🛠 Filters</h2>
        
        <label style="font-weight:bold; color:#94a3b8; font-size:0.8rem; margin-top:5px;">SELECT EMPIRE</label>
        <select id="ownerFilter" onchange="applyFilters()">
            <option value="all">Show All Empires</option>
            <option value="ambani">Mukesh Ambani (Jio/Network18)</option>
            <option value="adani">Gautam Adani (NDTV/AMG)</option>
            <option value="times">The Times Group (Jain Family)</option>
            <option value="zee">Zee Group (Subhash Chandra)</option>
            <option value="sony">Sony (Japan)</option>
            <option value="sun">Sun Group (Kalanithi Maran)</option>
            <option value="tv9">TV9 Network</option>
            <option value="print">Print Giants (Jagran/Bhaskar/HT)</option>
        </select>

        <label style="font-weight:bold; color:#94a3b8; font-size:0.8rem;">MEDIA SECTORS</label>
        
        <label><input type="checkbox" class="type-filter" value="news" checked onchange="applyFilters()"> 
            <span class="tag" style="background:#ef4444"></span>News Channels
        </label>
        
        <label><input type="checkbox" class="type-filter" value="ent" checked onchange="applyFilters()"> 
            <span class="tag" style="background:#eab308"></span>Entertainment TV
        </label>
        
        <label><input type="checkbox" class="type-filter" value="print" checked onchange="applyFilters()"> 
            <span class="tag" style="background:#10b981"></span>Print / Papers
        </label>
        
        <label><input type="checkbox" class="type-filter" value="ott" checked onchange="applyFilters()"> 
            <span class="tag" style="background:#8b5cf6"></span>OTT & Digital
        </label>

        <label><input type="checkbox" class="type-filter" value="sports" checked onchange="applyFilters()"> 
            <span class="tag" style="background:#f97316"></span>Sports
        </label>
    </div>

    <div id="mynetwork"></div>

    <script>
        // --- 1. THE DATASET (Hierarchical Structure) ---
        // rootId helps us filter by "Empire"
        
        const allNodes = [
            // --- AMBANI / JIOSTAR ---
            { id: 1, label: 'Mukesh Ambani\n(Reliance)', group: 'owner', rootId: 'ambani', level: 0 },
            { id: 2, label: 'JioStar\n(JV with Disney)', group: 'house', rootId: 'ambani', level: 1 },
            { id: 3, label: 'Network18', group: 'house', rootId: 'ambani', level: 1 },
            // Children
            { id: 101, label: 'Star Plus', group: 'ent', rootId: 'ambani', level: 2 },
            { id: 102, label: 'Disney+ Hotstar', group: 'ott', rootId: 'ambani', level: 2 },
            { id: 103, label: 'JioCinema', group: 'ott', rootId: 'ambani', level: 2 },
            { id: 104, label: 'Star Sports', group: 'sports', rootId: 'ambani', level: 2 },
            { id: 105, label: 'Colors', group: 'ent', rootId: 'ambani', level: 2 },
            { id: 106, label: 'CNN-News18', group: 'news', rootId: 'ambani', level: 2 },
            { id: 107, label: 'CNBC-TV18', group: 'news', rootId: 'ambani', level: 2 },
            { id: 108, label: 'MoneyControl', group: 'print', rootId: 'ambani', level: 2 },

            // --- ADANI ---
            { id: 4, label: 'Gautam Adani', group: 'owner', rootId: 'adani', level: 0 },
            { id: 5, label: 'AMG Media', group: 'house', rootId: 'adani', level: 1 },
            { id: 6, label: 'NDTV Group', group: 'house', rootId: 'adani', level: 2 }, // Hierarchy: Adani -> AMG -> NDTV
            // Children
            { id: 201, label: 'NDTV 24x7', group: 'news', rootId: 'adani', level: 3 },
            { id: 202, label: 'NDTV India', group: 'news', rootId: 'adani', level: 3 },
            { id: 203, label: 'The Quint', group: 'print', rootId: 'adani', level: 2 },
            { id: 204, label: 'NDTV Profit', group: 'news', rootId: 'adani', level: 3 },

            // --- TIMES GROUP ---
            { id: 7, label: 'Jain Family\n(BCCL)', group: 'owner', rootId: 'times', level: 0 },
            { id: 301, label: 'Times of India', group: 'print', rootId: 'times', level: 1 },
            { id: 302, label: 'Economic Times', group: 'print', rootId: 'times', level: 1 },
            { id: 303, label: 'Times Now', group: 'news', rootId: 'times', level: 1 },
            { id: 304, label: 'Radio Mirchi', group: 'ent', rootId: 'times', level: 1 },
            { id: 305, label: 'Cricbuzz', group: 'sports', rootId: 'times', level: 1 },

            // --- ZEE ---
            { id: 8, label: 'Subhash Chandra\n(Essel)', group: 'owner', rootId: 'zee', level: 0 },
            { id: 9, label: 'Zee Ent (ZEEL)', group: 'house', rootId: 'zee', level: 1 },
            // Children
            { id: 401, label: 'Zee TV', group: 'ent', rootId: 'zee', level: 2 },
            { id: 402, label: 'Zee News', group: 'news', rootId: 'zee', level: 2 },
            { id: 403, label: 'ZEE5', group: 'ott', rootId: 'zee', level: 2 },
            { id: 404, label: 'Zee Music', group: 'ent', rootId: 'zee', level: 2 },

            // --- SONY ---
            { id: 10, label: 'Sony Corp\n(Japan)', group: 'owner', rootId: 'sony', level: 0 },
            { id: 11, label: 'Culver Max\n(Sony India)', group: 'house', rootId: 'sony', level: 1 },
            // Children
            { id: 501, label: 'Sony TV (SET)', group: 'ent', rootId: 'sony', level: 2 },
            { id: 502, label: 'Sony LIV', group: 'ott', rootId: 'sony', level: 2 },
            { id: 503, label: 'Sony Sports', group: 'sports', rootId: 'sony', level: 2 },

            // --- SUN GROUP ---
            { id: 12, label: 'Kalanithi Maran', group: 'owner', rootId: 'sun', level: 0 },
            { id: 13, label: 'Sun Group', group: 'house', rootId: 'sun', level: 1 },
            // Children
            { id: 601, label: 'Sun TV', group: 'ent', rootId: 'sun', level: 2 },
            { id: 602, label: 'Sun NXT', group: 'ott', rootId: 'sun', level: 2 },
            { id: 603, label: 'SRH (IPL)', group: 'sports', rootId: 'sun', level: 2 },

            // --- PRINT TITANS ---
            { id: 14, label: 'Print Giants', group: 'house', rootId: 'print', level: 0 },
            { id: 701, label: 'Dainik Bhaskar', group: 'print', rootId: 'print', level: 1 },
            { id: 702, label: 'Dainik Jagran', group: 'print', rootId: 'print', level: 1 },
            { id: 703, label: 'Hindustan Times', group: 'print', rootId: 'print', level: 1 },
            { id: 704, label: 'Malayala Manorama', group: 'print', rootId: 'print', level: 1 },

            // --- TV9 ---
            { id: 15, label: 'My Home Group', group: 'owner', rootId: 'tv9', level: 0 },
            { id: 16, label: 'TV9 Network', group: 'house', rootId: 'tv9', level: 1 },
            { id: 801, label: 'TV9 Bharatvarsh', group: 'news', rootId: 'tv9', level: 2 },
            { id: 802, label: 'TV9 Telugu', group: 'news', rootId: 'tv9', level: 2 }
        ];

        const allEdges = [
            // Ambani
            { from: 1, to: 2 }, { from: 1, to: 3 },
            { from: 2, to: 101 }, { from: 2, to: 102 }, { from: 2, to: 103 }, { from: 2, to: 104 }, { from: 2, to: 105 },
            { from: 3, to: 106 }, { from: 3, to: 107 }, { from: 3, to: 108 },
            // Adani
            { from: 4, to: 5 }, { from: 5, to: 6 }, { from: 5, to: 203 },
            { from: 6, to: 201 }, { from: 6, to: 202 }, { from: 6, to: 204 },
            // Times
            { from: 7, to: 301 }, { from: 7, to: 302 }, { from: 7, to: 303 }, { from: 7, to: 304 }, { from: 7, to: 305 },
            // Zee
            { from: 8, to: 9 },
            { from: 9, to: 401 }, { from: 9, to: 402 }, { from: 9, to: 403 }, { from: 9, to: 404 },
            // Sony
            { from: 10, to: 11 },
            { from: 11, to: 501 }, { from: 11, to: 502 }, { from: 11, to: 503 },
            // Sun
            { from: 12, to: 13 },
            { from: 13, to: 601 }, { from: 13, to: 602 }, { from: 13, to: 603 },
            // Print
            { from: 14, to: 701 }, { from: 14, to: 702 }, { from: 14, to: 703 }, { from: 14, to: 704 },
            // TV9
            { from: 15, to: 16 }, { from: 16, to: 801 }, { from: 16, to: 802 }
        ];

        // --- 2. SETUP VIS.JS ---
        let network = null;
        let nodesDataSet = new vis.DataSet(allNodes);
        let edgesDataSet = new vis.DataSet(allEdges);

        function initNetwork() {
            const container = document.getElementById('mynetwork');
            const data = { nodes: nodesDataSet, edges: edgesDataSet };
            
            const options = {
                // Key Feature: HIERARCHICAL LAYOUT (Flowchart style)
                layout: {
                    hierarchical: {
                        direction: 'UD', // Up to Down
                        sortMethod: 'directed', // Follow the arrows
                        nodeSpacing: 150,
                        levelSeparation: 150,
                        treeSpacing: 200,
                        blockShifting: true,
                        edgeMinimization: true,
                        parentCentralization: true
                    }
                },
                nodes: {
                    shape: 'box',
                    margin: 10,
                    widthConstraint: { maximum: 120 },
                    font: { multi: true, color: 'white' },
                    borderWidth: 0,
                    shadow: true
                },
                edges: {
                    width: 2,
                    color: { color: '#64748b', inherit: 'from' },
                    smooth: { type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.4 },
                    arrows: { to: { enabled: true, scaleFactor: 0.5 } }
                },
                // Groups define colors
                groups: {
                    owner: { color: { background: '#2563EB' }, font: { size: 16, face: 'bold' } }, // Blue
                    house: { color: { background: '#334155' } }, // Dark Grey
                    news:  { color: { background: '#ef4444' } }, // Red
                    ent:   { color: { background: '#eab308' }, font: { color: 'black' } }, // Yellow
                    print: { color: { background: '#10b981' } }, // Green
                    ott:   { color: { background: '#8b5cf6' } }, // Purple
                    sports:{ color: { background: '#f97316' } }  // Orange
                },
                physics: false // Physics disabled for static flowchart look
            };

            network = new vis.Network(container, data, options);
            
            // Interaction: Tap to focus
            network.on("click", function(params) {
                if (params.nodes.length) {
                    network.focus(params.nodes[0], { animation: true, scale: 1.2 });
                }
            });
        }

        // --- 3. FILTER LOGIC ---
        function applyFilters() {
            const ownerVal = document.getElementById('ownerFilter').value;
            
            // Get all checked boxes for types
            const checkedTypes = Array.from(document.querySelectorAll('.type-filter:checked')).map(cb => cb.value);
            // Always include structural nodes (owners/houses) so the tree doesn't break
            checkedTypes.push('owner', 'house');

            // Filter Nodes
            const filteredNodes = allNodes.filter(node => {
                // 1. Check Owner
                const ownerMatch = (ownerVal === 'all') || (node.rootId === ownerVal);
                
                // 2. Check Type
                const typeMatch = checkedTypes.includes(node.group);

                return ownerMatch && typeMatch;
            });

            // Update Data
            nodesDataSet.clear();
            nodesDataSet.add(filteredNodes);
            
            // Re-fit view
            setTimeout(() => network.fit({ animation: true }), 100);
        }

        // Init
        window.addEventListener('load', () => {
            initNetwork();
            applyFilters(); // Apply default filters
        });

    </script>
</body>
</html>
