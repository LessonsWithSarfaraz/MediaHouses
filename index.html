<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indian Media Hierarchy</title>
    
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        #mynetwork { width: 100%; height: 100vh; background: #ffffff; }

        /* Sidebar Controls */
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 260px;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 100;
            border: 1px solid #e1e4e8;
        }

        h2 { font-size: 16px; margin: 0 0 10px 0; color: #1a202c; border-bottom: 2px solid #3182ce; padding-bottom: 5px; }
        h3 { font-size: 13px; margin: 15px 0 8px 0; color: #718096; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }

        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        
        label {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #2d3748;
            cursor: pointer;
            padding: 2px 0;
        }
        
        input[type="checkbox"] { margin-right: 8px; cursor: pointer; accent-color: #3182ce; }

        .badge {
            width: 10px; height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        /* Loading Overlay */
        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 200;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column;
        }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #3498db;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Mobile Toggle */
        .menu-toggle {
            display: none;
            position: absolute; top: 10px; left: 10px; z-index: 101;
            background: white; border: none; padding: 10px;
            border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            .controls { display: none; top: 50px; }
            .controls.active { display: block; }
            .menu-toggle { display: block; }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div style="color: #555; font-weight: 500;">Building Hierarchy...</div>
    </div>

    <button class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-filter"></i> Filters</button>

    <div class="controls" id="sidebar">
        <h2>📊 Media Hierarchy</h2>
        
        <h3>By Category</h3>
        <div class="filter-group">
            <label><input type="checkbox" checked onchange="updateFilter()" value="news"> <span class="badge" style="background:#ef4444"></span> News Channels</label>
            <label><input type="checkbox" checked onchange="updateFilter()" value="print"> <span class="badge" style="background:#10b981"></span> Print Media</label>
            <label><input type="checkbox" checked onchange="updateFilter()" value="ott"> <span class="badge" style="background:#8b5cf6"></span> OTT / Apps</label>
            <label><input type="checkbox" checked onchange="updateFilter()" value="movie"> <span class="badge" style="background:#eab308"></span> TV / Movies</label>
            <label><input type="checkbox" checked onchange="updateFilter()" value="sports"> <span class="badge" style="background:#f97316"></span> Sports</label>
        </div>

        <h3>By Ownership Group</h3>
        <div class="filter-group" id="ownerFilters">
            </div>
        
        <div style="margin-top:20px; text-align: center;">
            <button onclick="network.fit({animation:true})" style="padding: 6px 12px; background: #edf2f7; border: 1px solid #cbd5e0; border-radius: 4px; cursor: pointer;">Recenter Map</button>
        </div>
    </div>

    <div id="mynetwork"></div>

    <script>
        // --- 1. THE DATA ---
        // Each node now has a 'master' property to identify which empire it belongs to.
        const rawNodes = [
            // --- RELIANCE / DISNEY (Master: reliance) ---
            { id: 1, label: 'Reliance\n(Ambani)', group: 'owner', master: 'reliance', level: 0 },
            { id: 2, label: 'Disney', group: 'owner', master: 'reliance', level: 0 },
            { id: 3, label: 'JioStar\n(JV)', group: 'house', master: 'reliance', level: 1 },
            { id: 4, label: 'Network18', group: 'house', master: 'reliance', level: 1 },
            { id: 11, label: 'Star Plus', group: 'movie', master: 'reliance', level: 2 },
            { id: 12, label: 'Hotstar', group: 'ott', master: 'reliance', level: 2 },
            { id: 13, label: 'JioCinema', group: 'ott', master: 'reliance', level: 2 },
            { id: 14, label: 'Star Sports', group: 'sports', master: 'reliance', level: 2 },
            { id: 15, label: 'Colors', group: 'movie', master: 'reliance', level: 2 },
            { id: 16, label: 'CNN-News18', group: 'news', master: 'reliance', level: 2 },
            { id: 17, label: 'CNBC-TV18', group: 'news', master: 'reliance', level: 2 },
            { id: 18, label: 'MoneyControl', group: 'print', master: 'reliance', level: 2 },

            // --- ADANI (Master: adani) ---
            { id: 20, label: 'Adani', group: 'owner', master: 'adani', level: 0 },
            { id: 21, label: 'AMG Media', group: 'house', master: 'adani', level: 1 },
            { id: 22, label: 'NDTV', group: 'house', master: 'adani', level: 1 },
            { id: 23, label: 'NDTV 24x7', group: 'news', master: 'adani', level: 2 },
            { id: 24, label: 'NDTV India', group: 'news', master: 'adani', level: 2 },
            { id: 25, label: 'NDTV Profit', group: 'news', master: 'adani', level: 2 },
            { id: 26, label: 'The Quint', group: 'print', master: 'adani', level: 2 },
            { id: 27, label: 'IANS', group: 'news', master: 'adani', level: 2 },

            // --- TIMES (Master: times) ---
            { id: 30, label: 'Jain Family', group: 'owner', master: 'times', level: 0 },
            { id: 31, label: 'Times Group', group: 'house', master: 'times', level: 1 },
            { id: 32, label: 'Times of India', group: 'print', master: 'times', level: 2 },
            { id: 33, label: 'Economic Times', group: 'print', master: 'times', level: 2 },
            { id: 34, label: 'Times Now', group: 'news', master: 'times', level: 2 },
            { id: 36, label: 'Cricbuzz', group: 'sports', master: 'times', level: 2 },

            // --- ZEE (Master: zee) ---
            { id: 40, label: 'S. Chandra', group: 'owner', master: 'zee', level: 0 },
            { id: 41, label: 'ZEEL', group: 'house', master: 'zee', level: 1 },
            { id: 42, label: 'Zee TV', group: 'movie', master: 'zee', level: 2 },
            { id: 43, label: 'Zee News', group: 'news', master: 'zee', level: 2 },
            { id: 44, label: 'ZEE5', group: 'ott', master: 'zee', level: 2 },

            // --- SONY (Master: sony) ---
            { id: 50, label: 'Sony Global', group: 'owner', master: 'sony', level: 0 },
            { id: 51, label: 'Culver Max', group: 'house', master: 'sony', level: 1 },
            { id: 52, label: 'Sony SET', group: 'movie', master: 'sony', level: 2 },
            { id: 53, label: 'Sony LIV', group: 'ott', master: 'sony', level: 2 },
            { id: 54, label: 'Ten Sports', group: 'sports', master: 'sony', level: 2 },

            // --- SUN (Master: sun) ---
            { id: 60, label: 'K. Maran', group: 'owner', master: 'sun', level: 0 },
            { id: 61, label: 'Sun Group', group: 'house', master: 'sun', level: 1 },
            { id: 62, label: 'Sun TV', group: 'movie', master: 'sun', level: 2 },
            { id: 63, label: 'Sun NXT', group: 'ott', master: 'sun', level: 2 },

            // --- INDIA TODAY (Master: indiatoday) ---
            { id: 70, label: 'Aroon Purie', group: 'owner', master: 'indiatoday', level: 0 },
            { id: 71, label: 'India Today', group: 'house', master: 'indiatoday', level: 1 },
            { id: 72, label: 'Aaj Tak', group: 'news', master: 'indiatoday', level: 2 },

            // --- TV9 (Master: tv9) ---
            { id: 80, label: 'My Home', group: 'owner', master: 'tv9', level: 0 },
            { id: 81, label: 'TV9 Network', group: 'house', master: 'tv9', level: 1 },
            { id: 82, label: 'TV9 Bharat', group: 'news', master: 'tv9', level: 2 }
        ];

        const rawEdges = [
            // Reliance
            { from: 1, to: 3 }, { from: 1, to: 4 }, { from: 2, to: 3 },
            { from: 3, to: 11 }, { from: 3, to: 12 }, { from: 3, to: 13 }, { from: 3, to: 14 },
            { from: 4, to: 15 }, { from: 4, to: 16 }, { from: 4, to: 17 }, { from: 4, to: 18 },
            // Adani
            { from: 20, to: 21 }, { from: 21, to: 22 }, { from: 21, to: 26 }, { from: 21, to: 27 },
            { from: 22, to: 23 }, { from: 22, to: 24 }, { from: 22, to: 25 },
            // Times
            { from: 30, to: 31 }, { from: 31, to: 32 }, { from: 31, to: 33 }, { from: 31, to: 34 }, { from: 31, to: 36 },
            // Zee
            { from: 40, to: 41 }, { from: 41, to: 42 }, { from: 41, to: 43 }, { from: 41, to: 44 },
            // Sony
            { from: 50, to: 51 }, { from: 51, to: 52 }, { from: 51, to: 53 }, { from: 51, to: 54 },
            // Sun
            { from: 60, to: 61 }, { from: 61, to: 62 }, { from: 61, to: 63 },
            // India Today
            { from: 70, to: 71 }, { from: 71, to: 72 },
            // TV9
            { from: 80, to: 81 }, { from: 81, to: 82 }
        ];

        // --- 2. SETUP & FILTER LOGIC ---
        
        // Define Owners for the Sidebar
        const masters = [
            { id: 'reliance', label: 'Reliance & Disney' },
            { id: 'adani', label: 'Adani Group' },
            { id: 'times', label: 'Times Group' },
            { id: 'zee', label: 'Zee' },
            { id: 'sony', label: 'Sony' },
            { id: 'sun', label: 'Sun Group' },
            { id: 'indiatoday', label: 'India Today' },
            { id: 'tv9', label: 'TV9' }
        ];

        // Populate sidebar
        const ownerContainer = document.getElementById('ownerFilters');
        masters.forEach(m => {
            const div = document.createElement('div');
            div.innerHTML = `<label><input type="checkbox" checked onchange="updateFilter()" value="${m.id}" class="owner-check"> ${m.label}</label>`;
            ownerContainer.appendChild(div);
        });

        // Vis.js DataSets
        const nodesDataSet = new vis.DataSet(rawNodes);
        const edgesDataSet = new vis.DataSet(rawEdges);

        // --- 3. INITIALIZE GRAPH ---
        const container = document.getElementById('mynetwork');
        const data = { nodes: nodesDataSet, edges: edgesDataSet };
        const options = {
            layout: {
                hierarchical: {
                    direction: 'UD', // Up-Down
                    sortMethod: 'directed',
                    levelSeparation: 150,
                    nodeSpacing: 150,
                    treeSpacing: 200,
                    blockShifting: true,
                    edgeMinimization: true,
                    parentCentralization: true
                }
            },
            nodes: {
                shape: 'box',
                font: { face: 'Segoe UI', color: 'white', size: 14 },
                margin: 10,
                borderWidth: 0,
                shadow: true
            },
            groups: {
                owner: { color: '#2d3748', shape: 'box', font: {size: 16, color: '#fff'} }, // Dark Grey
                house: { color: '#4a5568', shape: 'box' }, // Medium Grey
                news: { color: '#ef4444', shape: 'ellipse' }, // Red
                print: { color: '#10b981', shape: 'ellipse' }, // Green
                movie: { color: '#eab308', shape: 'ellipse' }, // Yellow
                ott: { color: '#8b5cf6', shape: 'ellipse' }, // Purple
                sports: { color: '#f97316', shape: 'ellipse' } // Orange
            },
            edges: {
                color: { color: '#cbd5e0' },
                width: 1.5,
                smooth: { type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.4 },
                arrows: { to: { enabled: true, scaleFactor: 0.5 } }
            },
            physics: false, // Hierarchical layout works best without physics
            interaction: {
                hover: true,
                tooltipDelay: 200,
                zoomView: true,
                dragView: true
            }
        };

        const network = new vis.Network(container, data, options);

        // Remove loading screen when ready
        network.once("afterDrawing", function() {
            document.getElementById('loading').style.display = 'none';
            network.fit();
        });

        // --- 4. FILTER FUNCTION ---
        function updateFilter() {
            // Get selected categories
            const typeCheckboxes = document.querySelectorAll('input[type="checkbox"]:not(.owner-check)');
            const activeTypes = Array.from(typeCheckboxes).filter(c => c.checked).map(c => c.value);

            // Get selected owners
            const ownerCheckboxes = document.querySelectorAll('.owner-check');
            const activeOwners = Array.from(ownerCheckboxes).filter(c => c.checked).map(c => c.value);

            // Filter logic
            const filteredNodes = rawNodes.filter(node => {
                // 1. Check Owner
                if (!activeOwners.includes(node.master)) return false;

                // 2. Check Type (If it's an asset node)
                // We always show 'owner' and 'house' nodes to keep the tree structure alive,
                // unless the specific owner is hidden (handled by step 1).
                if (['owner', 'house'].includes(node.group)) return true;
                
                // If it's a leaf node (channel/paper), check if its category is active
                return activeTypes.includes(node.group);
            });

            // Update graph
            nodesDataSet.clear();
            nodesDataSet.add(filteredNodes);
            
            // Re-fit graph to view
            network.fit({ animation: true });
        }

        // --- 5. MOBILE MENU ---
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
        }

    </script>
</body>
</html>
