<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indian Media Universe: Expanded</title>
    
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        #mynetwork { width: 100%; height: 100vh; background: #ffffff; }

        /* Sidebar Controls */
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 280px;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 100;
            border: 1px solid #e2e8f0;
            backdrop-filter: blur(5px);
        }

        /* Scrollbar for controls */
        .controls::-webkit-scrollbar { width: 6px; }
        .controls::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }

        h2 { font-size: 18px; margin: 0 0 15px 0; color: #1e293b; border-bottom: 3px solid #3b82f6; padding-bottom: 8px; font-weight: 700; }
        h3 { font-size: 12px; margin: 15px 0 8px 0; color: #64748b; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; }

        .filter-group { display: flex; flex-direction: column; gap: 8px; }
        
        label {
            display: flex; align-items: center; font-size: 13px; color: #334155;
            cursor: pointer; padding: 2px 0; transition: color 0.2s;
        }
        label:hover { color: #0f172a; }
        
        input[type="checkbox"] { margin-right: 10px; cursor: pointer; accent-color: #3b82f6; width: 14px; height: 14px; }

        .badge {
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block; margin-right: 8px;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.1);
        }

        /* Node Counts */
        .count { font-size: 10px; background: #e2e8f0; padding: 1px 5px; border-radius: 4px; margin-left: auto; color: #64748b; }

        /* Loading Overlay */
        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #f8fafc; z-index: 200;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column;
        }
        .spinner {
            border: 4px solid #e2e8f0; border-top: 4px solid #3b82f6;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 0.8s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Mobile Toggle */
        .menu-toggle {
            display: none;
            position: absolute; top: 15px; left: 15px; z-index: 101;
            background: white; border: 1px solid #e2e8f0; padding: 8px 12px;
            border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-weight: 600; color: #334155;
        }

        @media (max-width: 768px) {
            .controls { display: none; top: 60px; height: 70vh; }
            .controls.active { display: block; }
            .menu-toggle { display: block; }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div style="color: #475569; font-weight: 600; font-size: 14px;">Mapping the Ecosystem...</div>
    </div>

    <button class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-filter"></i> Filters</button>

    <div class="controls" id="sidebar">
        <h2>🇮🇳 Media Ecosystem</h2>
        
        <h3>Category</h3>
        <div class="filter-group">
            <label><input type="checkbox" checked onchange="updateFilter()" value="ott"> <span class="badge" style="background:#8b5cf6"></span> OTT Platforms</label>
            <label><input type="checkbox" checked onchange="updateFilter()" value="movie"> <span class="badge" style="background:#eab308"></span> Studios / TV</label>
            <label><input type="checkbox" checked onchange="updateFilter()" value="music"> <span class="badge" style="background:#ec4899"></span> Music Labels</label>
            <label><input type="checkbox" checked onchange="updateFilter()" value="news"> <span class="badge" style="background:#ef4444"></span> News Media</label>
            <label><input type="checkbox" checked onchange="updateFilter()" value="app"> <span class="badge" style="background:#06b6d4"></span> Apps / Tech</label>
            <label><input type="checkbox" checked onchange="updateFilter()" value="print"> <span class="badge" style="background:#10b981"></span> Print</label>
            <label><input type="checkbox" checked onchange="updateFilter()" value="sports"> <span class="badge" style="background:#f97316"></span> Sports</label>
        </div>

        <h3>Ownership Group</h3>
        <div class="filter-group" id="ownerFilters">
            </div>
        
        <div style="margin-top:20px; text-align: center;">
            <button onclick="network.fit({animation:true})" style="padding: 8px 16px; background: #f1f5f9; border: 1px solid #cbd5e0; border-radius: 6px; cursor: pointer; color: #475569; font-size: 12px; font-weight: 600;">Recenter Graph</button>
        </div>
    </div>

    <div id="mynetwork"></div>

    <script>
        // --- 1. EXPANDED DATASET ---
        const rawNodes = [
            // === 1. JIOSTAR (Reliance + Disney) ===
            { id: 1, label: 'Reliance & Disney', group: 'owner', master: 'reliance', level: 0 },
            { id: 3, label: 'JioStar (JV)', group: 'house', master: 'reliance', level: 1 },
            { id: 4, label: 'Network18', group: 'house', master: 'reliance', level: 1 },
            // Assets
            { id: 11, label: 'Star Plus', group: 'movie', master: 'reliance', level: 2 },
            { id: 12, label: 'Disney+ Hotstar', group: 'ott', master: 'reliance', level: 2 },
            { id: 13, label: 'JioCinema', group: 'ott', master: 'reliance', level: 2 },
            { id: 14, label: 'Star Sports', group: 'sports', master: 'reliance', level: 2 },
            { id: 15, label: 'Sports18', group: 'sports', master: 'reliance', level: 2 },
            { id: 16, label: 'Colors', group: 'movie', master: 'reliance', level: 2 },
            { id: 17, label: 'CNN-News18', group: 'news', master: 'reliance', level: 2 },
            { id: 18, label: 'MoneyControl', group: 'app', master: 'reliance', level: 2 },
            { id: 19, label: 'JioSaavn', group: 'music', master: 'reliance', level: 2 },

            // === 2. GLOBAL GIANTS (Independent) ===
            { id: 90, label: 'Global Tech', group: 'owner', master: 'global', level: 0 },
            { id: 91, label: 'Netflix Inc', group: 'house', master: 'global', level: 1 },
            { id: 92, label: 'Netflix India', group: 'ott', master: 'global', level: 2 },
            { id: 93, label: 'Amazon', group: 'house', master: 'global', level: 1 },
            { id: 94, label: 'Prime Video', group: 'ott', master: 'global', level: 2 },
            { id: 95, label: 'Audible', group: 'app', master: 'global', level: 2 },
            { id: 96, label: 'Google', group: 'house', master: 'global', level: 1 },
            { id: 97, label: 'YouTube', group: 'ott', master: 'global', level: 2 },

            // === 3. INDEPENDENT STUDIOS (Movies/Music) ===
            { id: 100, label: 'Movie Moguls', group: 'owner', master: 'studio', level: 0 },
            { id: 101, label: 'T-Series', group: 'house', master: 'studio', level: 1 },
            { id: 102, label: 'T-Series Music', group: 'music', master: 'studio', level: 2 },
            { id: 103, label: 'Yash Raj Films', group: 'house', master: 'studio', level: 1 },
            { id: 104, label: 'YRF Music', group: 'music', master: 'studio', level: 2 },
            { id: 105, label: 'Dharma Prod.', group: 'house', master: 'studio', level: 1 },
            { id: 106, label: 'Red Chillies', group: 'house', master: 'studio', level: 1 },
            { id: 107, label: 'Excel Ent.', group: 'house', master: 'studio', level: 1 },
            
            // === 4. DIGITAL & APPS (New Age) ===
            { id: 120, label: 'Tech Entrepreneurs', group: 'owner', master: 'digital', level: 0 },
            { id: 121, label: 'Inshorts', group: 'app', master: 'digital', level: 2 },
            { id: 122, label: 'Dailyhunt', group: 'app', master: 'digital', level: 2 },
            { id: 123, label: 'TVF (Viral Fever)', group: 'ott', master: 'digital', level: 2 },
            { id: 124, label: 'Pocket FM', group: 'app', master: 'digital', level: 2 },
            { id: 125, label: 'Pratilipi', group: 'app', master: 'digital', level: 2 },

            // === 5. ADANI ===
            { id: 20, label: 'Adani Group', group: 'owner', master: 'adani', level: 0 },
            { id: 21, label: 'AMG Media', group: 'house', master: 'adani', level: 1 },
            { id: 22, label: 'NDTV Network', group: 'house', master: 'adani', level: 1 },
            { id: 23, label: 'NDTV 24x7', group: 'news', master: 'adani', level: 2 },
            { id: 24, label: 'BQ Prime', group: 'news', master: 'adani', level: 2 },
            { id: 26, label: 'The Quint', group: 'news', master: 'adani', level: 2 },
            { id: 27, label: 'IANS', group: 'news', master: 'adani', level: 2 },

            // === 6. TIMES GROUP ===
            { id: 30, label: 'Jain Family', group: 'owner', master: 'times', level: 0 },
            { id: 31, label: 'Times Group', group: 'house', master: 'times', level: 1 },
            { id: 32, label: 'Times of India', group: 'print', master: 'times', level: 2 },
            { id: 33, label: 'Economic Times', group: 'print', master: 'times', level: 2 },
            { id: 34, label: 'Times Now', group: 'news', master: 'times', level: 2 },
            { id: 35, label: 'Gaana', group: 'music', master: 'times', level: 2 },
            { id: 36, label: 'Cricbuzz', group: 'app', master: 'times', level: 2 },

            // === 7. SONY ===
            { id: 50, label: 'Sony Japan', group: 'owner', master: 'sony', level: 0 },
            { id: 51, label: 'Culver Max', group: 'house', master: 'sony', level: 1 },
            { id: 52, label: 'Sony SET', group: 'movie', master: 'sony', level: 2 },
            { id: 53, label: 'Sony LIV', group: 'ott', master: 'sony', level: 2 },
            { id: 54, label: 'Ten Sports', group: 'sports', master: 'sony', level: 2 },

            // === 8. ZEE ===
            { id: 40, label: 'Subhash Chandra', group: 'owner', master: 'zee', level: 0 },
            { id: 41, label: 'ZEEL', group: 'house', master: 'zee', level: 1 },
            { id: 42, label: 'Zee TV', group: 'movie', master: 'zee', level: 2 },
            { id: 43, label: 'Zee Music', group: 'music', master: 'zee', level: 2 },
            { id: 44, label: 'ZEE5', group: 'ott', master: 'zee', level: 2 },

             // === 9. DIGITAL NEWS (Independent) ===
            { id: 130, label: 'Indie Editors', group: 'owner', master: 'indie_news', level: 0 },
            { id: 131, label: 'The Print', group: 'news', master: 'indie_news', level: 2 },
            { id: 132, label: 'Newslaundry', group: 'news', master: 'indie_news', level: 2 },
            { id: 133, label: 'The Wire', group: 'news', master: 'indie_news', level: 2 },
        ];

        const rawEdges = [
            // Reliance
            { from: 1, to: 3 }, { from: 1, to: 4 },
            { from: 3, to: 11 }, { from: 3, to: 12 }, { from: 3, to: 13 }, { from: 3, to: 14 }, { from: 3, to: 15 }, { from: 3, to: 16 },
            { from: 4, to: 17 }, { from: 4, to: 18 }, { from: 3, to: 19 },
            // Global
            { from: 90, to: 91 }, { from: 90, to: 93 }, { from: 90, to: 96 },
            { from: 91, to: 92 }, { from: 93, to: 94 }, { from: 93, to: 95 }, { from: 96, to: 97 },
            // Studios
            { from: 100, to: 101 }, { from: 100, to: 103 }, { from: 100, to: 105 }, { from: 100, to: 106 }, { from: 100, to: 107 },
            { from: 101, to: 102 }, { from: 103, to: 104 },
            // Digital
            { from: 120, to: 121 }, { from: 120, to: 122 }, { from: 120, to: 123 }, { from: 120, to: 124 }, { from: 120, to: 125 },
            // Adani
            { from: 20, to: 21 }, { from: 21, to: 22 }, { from: 21, to: 26 }, { from: 21, to: 27 },
            { from: 22, to: 23 }, { from: 22, to: 24 },
            // Times
            { from: 30, to: 31 }, { from: 31, to: 32 }, { from: 31, to: 33 }, { from: 31, to: 34 }, { from: 31, to: 35 }, { from: 31, to: 36 },
            // Sony
            { from: 50, to: 51 }, { from: 51, to: 52 }, { from: 51, to: 53 }, { from: 51, to: 54 },
            // Zee
            { from: 40, to: 41 }, { from: 41, to: 42 }, { from: 41, to: 43 }, { from: 41, to: 44 },
            // Indie News
            { from: 130, to: 131 }, { from: 130, to: 132 }, { from: 130, to: 133 }
        ];

        // --- 2. CONFIG & LOGIC ---
        
        const masters = [
            { id: 'reliance', label: 'Reliance & Disney' },
            { id: 'global', label: 'Netflix / Amazon' },
            { id: 'studio', label: 'T-Series / YRF' },
            { id: 'digital', label: 'Inshorts / TVF' },
            { id: 'adani', label: 'Adani Group' },
            { id: 'times', label: 'Times Group' },
            { id: 'sony', label: 'Sony' },
            { id: 'zee', label: 'Zee' },
            { id: 'indie_news', label: 'Indie Digital News' }
        ];

        // Populate Sidebar
        const ownerContainer = document.getElementById('ownerFilters');
        masters.forEach(m => {
            const div = document.createElement('div');
            div.innerHTML = `<label><input type="checkbox" checked onchange="updateFilter()" value="${m.id}" class="owner-check"> ${m.label}</label>`;
            ownerContainer.appendChild(div);
        });

        // Setup DataSets
        const nodesDataSet = new vis.DataSet(rawNodes);
        const edgesDataSet = new vis.DataSet(rawEdges);

        const container = document.getElementById('mynetwork');
        const data = { nodes: nodesDataSet, edges: edgesDataSet };
        const options = {
            layout: {
                hierarchical: {
                    direction: 'UD',
                    sortMethod: 'directed',
                    levelSeparation: 140,
                    nodeSpacing: 100,
                    treeSpacing: 100,
                    blockShifting: true,
                    edgeMinimization: true,
                    parentCentralization: true
                }
            },
            nodes: {
                shape: 'box',
                font: { face: 'Segoe UI', color: 'white', size: 14 },
                margin: 10,
                borderWidth: 0,
                shadow: true
            },
            groups: {
                owner: { color: '#1e293b', shape: 'box', font: {size: 16, color: '#fff'} }, // Slate
                house: { color: '#475569', shape: 'box' }, // Light Slate
                news: { color: '#ef4444', shape: 'ellipse' }, // Red
                print: { color: '#10b981', shape: 'ellipse' }, // Green
                movie: { color: '#eab308', shape: 'ellipse' }, // Yellow
                ott: { color: '#8b5cf6', shape: 'ellipse' }, // Purple
                sports: { color: '#f97316', shape: 'ellipse' }, // Orange
                music: { color: '#ec4899', shape: 'ellipse' }, // Pink
                app: { color: '#06b6d4', shape: 'ellipse' } // Cyan
            },
            edges: {
                color: { color: '#cbd5e0' },
                width: 1.5,
                smooth: { type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.4 },
                arrows: { to: { enabled: true, scaleFactor: 0.5 } }
            },
            physics: false,
            interaction: {
                hover: true,
                tooltipDelay: 200,
                zoomView: true,
                dragView: true
            }
        };

        const network = new vis.Network(container, data, options);

        network.once("afterDrawing", function() {
            document.getElementById('loading').style.display = 'none';
            network.fit();
        });

        function updateFilter() {
            const typeCheckboxes = document.querySelectorAll('input[type="checkbox"]:not(.owner-check)');
            const activeTypes = Array.from(typeCheckboxes).filter(c => c.checked).map(c => c.value);

            const ownerCheckboxes = document.querySelectorAll('.owner-check');
            const activeOwners = Array.from(ownerCheckboxes).filter(c => c.checked).map(c => c.value);

            const filteredNodes = rawNodes.filter(node => {
                if (!activeOwners.includes(node.master)) return false;
                if (['owner', 'house'].includes(node.group)) return true;
                return activeTypes.includes(node.group);
            });

            nodesDataSet.clear();
            nodesDataSet.add(filteredNodes);
            network.fit({ animation: true });
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
        }
    </script>
</body>
</html>
